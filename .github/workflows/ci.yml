name: Docker CI/CD + Terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  terraform-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

  build-test-docker-deploy:
    runs-on: ubuntu-latest
    needs: terraform-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Generate Docker image tag
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build Docker image locally
        run: |
          docker build -t nodeapp:${{ steps.meta.outputs.short_sha }} .

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push Docker image
        if: ${{ github.event_name == 'push' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag nodeapp:${{ steps.meta.outputs.short_sha }} "$DOCKERHUB_USERNAME/nodeapp:${{ steps.meta.outputs.short_sha }}"
          docker tag nodeapp:${{ steps.meta.outputs.short_sha }} "$DOCKERHUB_USERNAME/nodeapp:${{ steps.meta.outputs.branch }}"
          docker push "$DOCKERHUB_USERNAME/nodeapp:${{ steps.meta.outputs.short_sha }}"
          docker push "$DOCKERHUB_USERNAME/nodeapp:${{ steps.meta.outputs.branch }}"

      - name: Decode SSH key
        if: ${{ github.event_name == 'push' && env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY_B64 != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          echo "$EC2_SSH_KEY_B64" | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Copy Docker Compose file to EC2
        if: ${{ github.event_name == 'push' && env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY_B64 != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" "mkdir -p ~/nodeapp"
          scp -o StrictHostKeyChecking=no -i ec2-key.pem docker-compose.yml "$EC2_USER@$EC2_HOST:~/nodeapp/docker-compose.yml"

      - name: Deploy with Docker Compose on EC2
        if: ${{ github.event_name == 'push' && env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY_B64 != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" << EOF
            set -e

            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete all || true
              sudo npm uninstall -g pm2 || true
            fi

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              . /etc/os-release
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \$VERSION_CODENAME stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            cd ~/nodeapp
            sudo docker rm -f nodeapp || true
            sudo DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" IMAGE_TAG="${{ steps.meta.outputs.short_sha }}" docker compose pull
            sudo DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME" IMAGE_TAG="${{ steps.meta.outputs.short_sha }}" docker compose up -d
            sudo docker compose ps
          EOF

      - name: Deployment configuration notice
        if: ${{ github.event_name == 'push' && (env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' || env.EC2_HOST == '' || env.EC2_USER == '' || env.EC2_SSH_KEY_B64 == '') }}
        run: |
          echo "CI, Terraform validation and Docker build completed."
          echo "Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish the image."
          echo "After terraform apply, update EC2_HOST with the instance_ip output."
          echo "Add EC2_USER and EC2_SSH_KEY_B64 to enable EC2 deployment."
