name: Ohm Lab CI/CD
on:
  push:
    branches: [main, final-devops-project]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ohm-lab-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: students/dovzhuk-timofii
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: students/dovzhuk-timofii/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
      - name: Build and run containers before deployment
        env:
          POSTGRES_PASSWORD: ci-test-only-password
        run: |
          docker compose up -d --build --wait --wait-timeout 120
          curl --fail --retry 5 --retry-connrefused http://localhost:3000/ready
          curl --fail 'http://localhost:3000/api/ohm?voltage=12&resistance=100' | python3 -c 'import json,sys; assert json.load(sys.stdin)["current"] == 0.12'
      - name: Container diagnostics
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-test-only-password
        run: docker compose logs --tail=80
      - name: Stop test containers
        if: always()
        env:
          POSTGRES_PASSWORD: ci-test-only-password
        run: docker compose down -v

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: students/dovzhuk-timofii
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_key_name: ${{ vars.EC2_KEY_NAME || 'devops-key' }}
      TF_VAR_instance_type: ${{ vars.EC2_INSTANCE_TYPE || 't3.micro' }}
      TF_VAR_ami_id: ${{ vars.EC2_AMI_ID }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment configuration
        run: |
          for name in DOCKER_USERNAME DOCKER_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_STATE_BUCKET EC2_SSH_KEY_B64 EC2_KNOWN_HOSTS POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. See students/dovzhuk-timofii/README.md"
              exit 1
            fi
          done
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: students/dovzhuk-timofii
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/nodeapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Initialize shared state
        run: |
          terraform -chdir=infra init -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Create or update EC2
        id: infra
        run: |
          export TF_VAR_aws_region="$AWS_REGION"
          RUNNER_IP=$(curl --fail --silent --show-error https://checkip.amazonaws.com)
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          export TF_VAR_ssh_cidr="$RUNNER_IP/32"
          terraform -chdir=infra plan -lock-timeout=5m -out=deploy.tfplan
          terraform -chdir=infra apply -lock-timeout=5m deploy.tfplan
          echo "host=$(terraform -chdir=infra output -raw instance_ip)" >> "$GITHUB_OUTPUT"
          aws ec2 wait instance-status-ok --instance-ids "$(terraform -chdir=infra output -raw instance_id)" --region "$AWS_REGION"
      - name: Deploy and verify application
        env:
          EC2_HOST: ${{ steps.infra.outputs.host }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/deploy.sh
      - name: Deployment result
        env:
          EC2_HOST: ${{ steps.infra.outputs.host }}
        run: |
          echo "### Ohm Lab" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: http://$EC2_HOST:3000" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $DOCKER_USERNAME/nodeapp:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
