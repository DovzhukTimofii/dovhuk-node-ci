services:
  app:
    image: ${DOCKER_USERNAME:-ohm-lab}/nodeapp:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: nodeapp
      DATABASE_URL: postgres://db/nodeapp
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nodeapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nodeapp"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
